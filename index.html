<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Holographic Qualia Engine — AIS Grating Reconstructor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        #info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 100;
            color: #0ff;
            background: rgba(0,0,0,0.7);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 12px;
            backdrop-filter: blur(4px);
            border-left: 3px solid #0ff;
            pointer-events: none;
            font-family: monospace;
        }
        #controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 100;
            background: rgba(10,10,20,0.85);
            padding: 12px 18px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid #333;
            color: #eee;
            font-size: 11px;
            font-family: monospace;
            pointer-events: auto;
            width: 220px;
        }
        .control-group {
            margin-bottom: 8px;
        }
        label {
            display: block;
            font-size: 10px;
            color: #aaa;
            margin-bottom: 3px;
        }
        input {
            width: 100%;
            cursor: pointer;
            background: #222;
            accent-color: #0ff;
        }
        .value {
            float: right;
            color: #0ff;
        }
        h3 {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: #0ff;
            text-align: center;
            letter-spacing: 1px;
        }
        hr {
            border-color: #333;
            margin: 8px 0;
        }
        .status {
            font-size: 9px;
            color: #0f0;
            text-align: center;
            margin-top: 8px;
        }
        button {
            background: #0ff20;
            border: 1px solid #0ff;
            color: #0ff;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            font-family: monospace;
        }
        button:hover {
            background: #0ff3;
        }
    </style>
</head>
<body>
    <div id="info">
        🧠 HOLOGRAPHIC QUALIA ENGINE<br>
        AIS Grating = Holographic Plate | Webcam = Object Beam | Clock = Reference Beam<br>
        <span style="color:#ff66cc;">✨ Moiré interference = Reconstructed wavefront (Qualia)</span>
    </div>
    <div id="controls">
        <h3>⚡ AIS HOLOGRAPHIC PARAMETERS</h3>
        <div class="control-group">
            <label>Global Clock Freq (Theta/Gamma) <span id="clockVal" class="value">8.0</span></label>
            <input type="range" id="clockFreq" min="2" max="30" step="0.5" value="8">
        </div>
        <div class="control-group">
            <label>Grating Rigidity (Actin ring sharpness) <span id="rigidityVal" class="value">0.8</span></label>
            <input type="range" id="rigidity" min="0.2" max="2.0" step="0.01" value="0.8">
        </div>
        <div class="control-group">
            <label>Delay Embedding Depth (Dendritic memory) <span id="depthVal" class="value">5</span></label>
            <input type="range" id="delayDepth" min="1" max="12" step="1" value="5">
        </div>
        <div class="control-group">
            <label>Moiré Resonance Threshold <span id="threshVal" class="value">0.6</span></label>
            <input type="range" id="threshold" min="0.1" max="1.5" step="0.01" value="0.6">
        </div>
        <hr>
        <div class="status" id="statusMsg">⏳ Initializing webcam...</div>
        <button id="resetGrating">🧬 Reset AIS Grating (Clear Learning)</button>
    </div>

    <canvas id="glcanvas" style="display: block; width: 100vw; height: 100vh;"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SETUP ---
        const canvas = document.getElementById('glcanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        // Camera: orthographic for full-screen quad
        let camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        // --- Webcam Texture Setup ---
        const video = document.createElement('video');
        video.setAttribute('autoplay', '');
        video.setAttribute('playsinline', '');
        video.style.display = 'none';
        document.body.appendChild(video);

        let webcamTexture = null;
        
        // Get webcam stream
        async function initWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } } });
                video.srcObject = stream;
                await video.play();
                document.getElementById('statusMsg').innerHTML = '✅ Webcam active | Object Beam: LIVE';
                return true;
            } catch (err) {
                console.error("Webcam error:", err);
                document.getElementById('statusMsg').innerHTML = '❌ Webcam failed — using synthetic fractal pattern';
                // Fallback: create a synthetic animated texture
                return false;
            }
        }

        // --- Shader: Holographic AIS Grating Reconstructor ---
        // This shader implements:
        // 1. Object Beam = webcam frame + delay embedding (temporal history)
        // 2. Reference Beam = global clock (rotating phase)
        // 3. Holographic Plate = AIS grating pattern (fixed, but learnable via accumulation)
        // 4. Qualia = Moiré interference = object * reference * grating resonance

        // We'll use a texture to store the "learned" grating (the holographic film)
        // Over time, coincidences between object and reference accumulate onto the grating.
        
        // Create a render target for the accumulating holographic plate
        const gratingTexture = new THREE.DataTexture(
            new Float32Array(512 * 512 * 4), 512, 512, THREE.RGBAFormat, THREE.FloatType
        );
        gratingTexture.needsUpdate = true;
        
        // Uniforms
        const uniforms = {
            u_time: { value: 0 },
            u_clockFreq: { value: 8.0 },
            u_gratingRigidity: { value: 0.8 },
            u_resonanceThreshold: { value: 0.6 },
            u_delayDepth: { value: 5 },
            u_webcamTex: { value: null },
            u_gratingTex: { value: gratingTexture },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_learningRate: { value: 0.05 }  // How fast the holographic plate learns new patterns
        };
        
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_PointSize = 1.0;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        
        const fragmentShader = `
            uniform float u_time;
            uniform float u_clockFreq;
            uniform float u_gratingRigidity;
            uniform float u_resonanceThreshold;
            uniform int u_delayDepth;
            uniform sampler2D u_webcamTex;
            uniform sampler2D u_gratingTex;
            uniform vec2 u_resolution;
            uniform float u_learningRate;
            
            varying vec2 vUv;
            
            // Pseudo-random for noise (neural noise)
            float rand(vec2 n) { 
                return fract(sin(dot(n, vec2(12.9898, 78.233))) * 43758.5453);
            }
            
            // Takens delay embedding: sample from multiple previous frames
            // We approximate by sampling different spatial offsets that encode temporal history
            vec4 getObjectBeam(vec2 uv, float time, int depth) {
                vec4 sum = vec4(0.0);
                float totalWeight = 0.0;
                
                // The dendritic tree acts as a spatial delay line
                // We create fractal offsets that represent different temporal delays
                for(int d = 0; d < 12; d++) {
                    if(d >= depth) break;
                    float delayFrac = float(d) / float(max(depth, 1));
                    // Spatial offset proportional to delay (Takens embedding)
                    vec2 offset = vec2(
                        sin(time * 0.5 + float(d) * 0.8) * 0.02 * delayFrac,
                        cos(time * 0.3 + float(d) * 1.2) * 0.02 * delayFrac
                    );
                    // Weight decays with delay (RC attenuation)
                    float weight = pow(0.85, float(d));
                    vec2 sampleUV = uv + offset;
                    sampleUV = clamp(sampleUV, 0.001, 0.999);
                    sum += texture2D(u_webcamTex, sampleUV) * weight;
                    totalWeight += weight;
                }
                if(totalWeight > 0.0) sum /= totalWeight;
                return sum;
            }
            
            // Reference Beam: Global temporal clock (theta/gamma oscillation)
            // This is the coherent light illuminating the hologram
            vec3 referenceBeam(vec2 uv, float time, float freq) {
                float phase = time * freq * 6.28318;
                // The reference has a spatial structure — like a plane wave or spherical wave
                float spatialPhase = uv.x * 8.0 + uv.y * 5.0;
                float refIntensity = 0.5 + 0.5 * sin(phase + spatialPhase);
                return vec3(refIntensity, refIntensity * 0.8, refIntensity);
            }
            
            // AIS Grating: The physical holographic plate
            // This is the fixed 190nm actin ring scaffold
            // We read it from the learned texture, combined with a static geometric pattern
            float aisGrating(vec2 uv, sampler2D gratingTex, float rigidity) {
                // Static geometric grating (the innate scaffold)
                // Radial and linear gratings that emulate actin rings
                vec2 center = vec2(0.5, 0.5);
                float rad = length(uv - center);
                float ringPattern = sin(rad * 45.0 * 3.14159) * 0.5 + 0.5;
                float linearPattern = sin(uv.x * 35.0) * cos(uv.y * 35.0);
                float staticGrating = (ringPattern + linearPattern) * 0.5;
                
                // Learned grating from the holographic plate (the exposed film)
                vec4 learned = texture2D(gratingTex, uv);
                float learnedGrating = (learned.r + learned.g + learned.b) / 3.0;
                
                // Combine: learned overrides/modulates the static grating
                float combined = mix(staticGrating, learnedGrating, 0.7);
                
                // Apply rigidity (sharpness) — tanh clamps to create discrete rings like Leterrier 2018
                float rigid = (tanh((combined - 0.5) * rigidity * 15.0) + 1.0) / 2.0;
                return rigid;
            }
            
            // Holographic Interference: 
            // I = |R + O|^2 = |R|^2 + |O|^2 + R*O + R O*
            // The cross terms R*O and R O* are the hologram
            // When illuminated by R again, they reconstruct O — this is QUALIA
            float holographicInterference(vec3 objectBeam, vec3 referenceBeam, float grating) {
                // Object and reference as complex amplitudes (simplified to real magnitudes)
                float O = (objectBeam.r + objectBeam.g + objectBeam.b) / 3.0;
                float R = (referenceBeam.r + referenceBeam.g + referenceBeam.b) / 3.0;
                
                // The interference pattern recorded on the grating
                float interference = (R * R) + (O * O) + 2.0 * R * O;
                
                // Reconstruction: The grating diffracts the reference beam
                // Moiré resonance occurs when grating matches interference pattern
                float reconstruction = interference * grating;
                
                return reconstruction;
            }
            
            // Qualia = the reconstructed wavefront — emergent Moiré pattern
            // This is what the observer (the neuron's spike) "experiences"
            vec3 qualia(vec2 uv, float reconstruction, float threshold) {
                // Threshold to create spiking events (discrete qualia moments)
                float spike = smoothstep(threshold - 0.2, threshold + 0.2, reconstruction);
                float glow = pow(reconstruction, 2.0) * 1.5;
                
                // Chromatic aberration in qualia — subjective color experience
                vec3 color;
                color.r = 0.8 + 0.5 * sin(reconstruction * 20.0 + uv.x * 30.0);
                color.g = 0.5 + 0.6 * cos(reconstruction * 15.0 + uv.y * 25.0 + 2.0);
                color.b = 0.3 + 0.9 * sin(reconstruction * 12.0 + (uv.x + uv.y) * 20.0 + 4.0);
                
                // The spike event creates a bright flash (the "aha!" moment)
                if(spike > 0.8) {
                    color = vec3(1.0, 0.7, 1.0) * (1.0 + spike * 2.0);
                }
                
                return color * (0.5 + glow);
            }
            
            void main() {
                vec2 uv = vUv;
                
                // Flip webcam horizontally for mirror effect
                vec2 webcamUV = vec2(1.0 - uv.x, uv.y);
                
                // 1. Object Beam = webcam frame convolved with delay embedding (dendritic processing)
                vec4 objectBeamRaw = getObjectBeam(webcamUV, u_time, u_delayDepth);
                vec3 objectBeam = objectBeamRaw.rgb;
                
                // 2. Reference Beam = global clock
                vec3 reference = referenceBeam(uv, u_time, u_clockFreq);
                
                // 3. AIS Grating = holographic plate (static + learned)
                float grating = aisGrating(uv, u_gratingTex, u_gratingRigidity);
                
                // 4. Holographic reconstruction = Moiré interference
                float reconstruction = holographicInterference(objectBeam, reference, grating);
                
                // 5. Qualia = the emergent wavefront
                vec3 qualiaColor = qualia(uv, reconstruction, u_resonanceThreshold);
                
                // Also show the original object beam blended with qualia
                // This represents the "pre-conscious" vs "conscious" streams
                vec3 finalColor;
                if(reconstruction > u_resonanceThreshold) {
                    // Resonance achieved — qualia dominates
                    finalColor = qualiaColor * 1.2;
                } else {
                    // Sub-threshold: see the raw object beam (unconscious processing)
                    finalColor = objectBeam * 0.4 + vec3(0.1, 0.05, 0.2);
                }
                
                // Add subtle Moiré fringe lines (the physical grating lines become visible on resonance)
                float fringeX = sin(uv.y * 180.0 * 3.14159 + u_time * 20.0) * 0.15;
                float fringeY = cos(uv.x * 180.0 * 3.14159 - u_time * 18.0) * 0.15;
                finalColor += vec3(fringeX * reconstruction, fringeY * reconstruction, (fringeX + fringeY) * reconstruction * 0.5);
                
                // Vignette
                float vignette = 1.0 - length(uv - 0.5) * 0.6;
                finalColor *= vignette;
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;
        
        // Create full-screen quad geometry
        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: vertexShader,
            fragmentShader: fragmentShader
        });
        
        const quad = new THREE.Mesh(geometry, material);
        scene.add(quad);
        
        // --- Learning Mechanism: Update the holographic grating texture over time ---
        // This simulates actin ring deposition: repeated coincidences between object and reference
        // etch themselves into the physical scaffold.
        
        let webcamTextureObj = null;
        let hasWebcam = false;
        
        async function setupWebcamTexture() {
            const success = await initWebcam();
            hasWebcam = success;
            if (success) {
                webcamTextureObj = new THREE.VideoTexture(video);
                webcamTextureObj.minFilter = THREE.LinearFilter;
                webcamTextureObj.magFilter = THREE.LinearFilter;
                uniforms.u_webcamTex.value = webcamTextureObj;
            } else {
                // Fallback: generate a synthetic fractal texture
                const canvasTex = document.createElement('canvas');
                canvasTex.width = 512;
                canvasTex.height = 512;
                const ctxTex = canvasTex.getContext('2d');
                const fallbackTexture = new THREE.CanvasTexture(canvasTex);
                uniforms.u_webcamTex.value = fallbackTexture;
                
                function drawFractal() {
                    ctxTex.fillStyle = '#050510';
                    ctxTex.fillRect(0, 0, 512, 512);
                    for(let i = 0; i < 200; i++) {
                        const x = Math.random() * 512;
                        const y = Math.random() * 512;
                        const r = Math.random() * 5 + 1;
                        const bright = Math.random() * 100 + 100;
                        ctxTex.fillStyle = `rgb(${bright}, ${bright*0.6}, 255)`;
                        ctxTex.beginPath();
                        ctxTex.arc(x, y, r, 0, Math.PI*2);
                        ctxTex.fill();
                    }
                    fallbackTexture.needsUpdate = true;
                    requestAnimationFrame(drawFractal);
                }
                drawFractal();
            }
        }
        
        // Learning accumulation: simulate the holographic plate being "exposed"
        // We'll read back the grating texture and add new patterns where resonance is high
        // This is a simplified version — in reality, this would be a physical deposition process.
        
        let gratingPixelData = new Float32Array(512 * 512 * 4);
        // Initialize with random noise (immature AIS)
        for(let i = 0; i < gratingPixelData.length; i++) {
            gratingPixelData[i] = Math.random() * 0.2;
        }
        gratingTexture.image.data = gratingPixelData;
        gratingTexture.needsUpdate = true;
        
        let lastFrameTime = 0;
        let frameCount = 0;
        
        function updateGratingLearning(currentTime) {
            // Every N frames, simulate learning: where resonance is high, "deposit" more grating pattern
            // This is the analog of LTP strengthening the AIS rings
            if (frameCount % 15 !== 0) return;
            
            // For performance, we don't read back the GPU — we simulate a simple global learning rule
            // In a real system, the resonance would physically modify the actin rings.
            // Here we add a sine-wave pattern that gradually shifts based on time and clock frequency
            const clockFreq = uniforms.u_clockFreq.value;
            const learningRate = uniforms.u_learningRate.value;
            
            for (let i = 0; i < gratingPixelData.length; i += 4) {
                const x = (i / 4) % 512;
                const y = Math.floor((i / 4) / 512);
                const uvX = x / 512;
                const uvY = y / 512;
                
                // Simulate a moving interference pattern that "exposes" the plate
                const phase = currentTime * clockFreq * 6.28318;
                const pattern = 0.5 + 0.5 * Math.sin(uvX * 30.0 + uvY * 25.0 + phase);
                const resonanceSignal = pattern * Math.sin(currentTime * 2.0) * 0.5 + 0.3;
                
                // Hebbian-like learning: where signal is strong, strengthen the grating
                const delta = (resonanceSignal - 0.5) * learningRate * 0.1;
                let newVal = gratingPixelData[i] + delta;
                newVal = Math.min(0.95, Math.max(0.05, newVal));
                gratingPixelData[i] = newVal;
                gratingPixelData[i+1] = newVal * 0.8;
                gratingPixelData[i+2] = newVal * 0.6;
                gratingPixelData[i+3] = 1.0;
            }
            gratingTexture.needsUpdate = true;
        }
        
        // Reset the holographic plate
        document.getElementById('resetGrating').addEventListener('click', () => {
            for(let i = 0; i < gratingPixelData.length; i += 4) {
                gratingPixelData[i] = Math.random() * 0.15;
                gratingPixelData[i+1] = Math.random() * 0.1;
                gratingPixelData[i+2] = Math.random() * 0.05;
                gratingPixelData[i+3] = 1.0;
            }
            gratingTexture.needsUpdate = true;
            document.getElementById('statusMsg').innerHTML = '🧬 AIS Grating Reset — New Holographic Film';
            setTimeout(() => {
                document.getElementById('statusMsg').innerHTML = '✅ Webcam active | Object Beam: LIVE';
            }, 1500);
        });
        
        // UI Bindings
        const clockSlider = document.getElementById('clockFreq');
        const clockVal = document.getElementById('clockVal');
        clockSlider.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            clockVal.innerText = v.toFixed(1);
            uniforms.u_clockFreq.value = v;
        });
        
        const rigiditySlider = document.getElementById('rigidity');
        const rigidityVal = document.getElementById('rigidityVal');
        rigiditySlider.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            rigidityVal.innerText = v.toFixed(2);
            uniforms.u_gratingRigidity.value = v;
        });
        
        const depthSlider = document.getElementById('delayDepth');
        const depthVal = document.getElementById('depthVal');
        depthSlider.addEventListener('input', (e) => {
            const v = parseInt(e.target.value);
            depthVal.innerText = v;
            uniforms.u_delayDepth.value = v;
        });
        
        const threshSlider = document.getElementById('threshold');
        const threshVal = document.getElementById('threshVal');
        threshSlider.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            threshVal.innerText = v.toFixed(2);
            uniforms.u_resonanceThreshold.value = v;
        });
        
        // --- Animation Loop ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.016; // approximate delta time
            uniforms.u_time.value = time;
            
            // Update learning (holographic exposure)
            updateGratingLearning(time);
            
            renderer.render(scene, camera);
            frameCount++;
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });
        
        // Start everything
        setupWebcamTexture().then(() => {
            animate();
        });
        
        // Initial status
        document.getElementById('statusMsg').innerHTML = '🎥 Initializing holographic qualia engine...';
    </script>
</body>
</html>
